services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioninspect-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: visioninspect-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped